name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid semver version: $version"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version files
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $packageJson.version = $version
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content package.json

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoToml = $cargoToml -replace '(?m)^version = ".*"$', "version = `"$version`""
          Set-Content src-tauri/Cargo.toml $cargoToml

          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $version
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app and NSIS installer
        run: pnpm package:win

      - name: Commit version bump
        id: release_commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release: ${{ inputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "No version file changes to commit."
          }

          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $headCommit = git rev-parse HEAD

          git fetch --force origin "refs/tags/$($version):refs/tags/$($version)" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tag $version does not exist on origin yet."
            exit 0
          }

          $tagCommit = git rev-list -n 1 $version
          if ($tagCommit -ne $headCommit) {
            throw "Tag $version already exists on origin and points to $tagCommit instead of $headCommit"
          }

          Write-Host "Tag $version already exists on the current release commit; continuing."

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/GregTech-Lite-Modpack-Downloader.exe
            src-tauri/target/release/bundle/nsis/*.exe
